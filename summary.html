<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ملخص المقرر — منصة المذاكرة</title>
<meta name="description" content="ملخصات مقررات منصة المذاكرة للقراءة والتحميل: أصول كتابة البحث العلمي، ومناهج المفسرين، في خرائط ذهنية وجداول مع ملف PDF.">
<meta name="theme-color" content="#0b2a52">
<link rel="icon" href="favicon.png" type="image/png" sizes="48x48"><link rel="icon" href="favicon.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@700&family=Noto+Kufi+Arabic:wght@600;700&family=Tajawal:wght@400;500;700&display=swap">
<style>
:root{
  --paper:#e6ebf2; --surface:#ffffff; --line:#d5deea; --ink:#16213a; --muted:#56637a;
  --navy-1:#071d3d; --navy-2:#0b2a52; --gold:#c9972b; --gold-2:#f0c96b;
  --f-title:"Aref Ruqaa",serif; --f-head:"Noto Kufi Arabic","Tajawal",sans-serif; --f-ui:"Tajawal","Noto Kufi Arabic",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root{--paper:#0a1120;--surface:#111b2e;--line:#24324a;--ink:#e6ebf4;--muted:#9aa8c0}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--f-ui);min-height:100vh}
.bar{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:10px;padding:10px 16px;padding-top:max(10px,env(safe-area-inset-top));
  background:linear-gradient(150deg,var(--navy-2),var(--navy-1));color:#fff;box-shadow:0 4px 16px rgba(0,0,0,.18)}
.bar h1{flex:1;min-width:0;margin:0;font-family:var(--f-title);font-size:clamp(20px,4.6vw,28px);line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:40px;padding:0 14px;border-radius:10px;border:1px solid rgba(240,201,107,.45);
  background:rgba(255,255,255,.08);color:#fff;font:600 14px var(--f-head);text-decoration:none;cursor:pointer;white-space:nowrap}
.btn:hover,.btn:focus-visible{background:rgba(255,255,255,.16);outline:none;border-color:var(--gold-2)}
.btn.gold{background:var(--gold-2);color:#2a1d02;border-color:var(--gold-2)}
.btn.gold:hover{background:#f6d88c}
.btn svg{width:18px;height:18px}
.tools{display:flex;gap:8px;align-items:center}
.zoom{display:flex;gap:4px}
.zoom .btn{width:40px;padding:0;font-size:20px}
.count{font:500 13px var(--f-ui);color:#cfdcf0;min-width:62px;text-align:center}
@media (max-width:640px){.zoom,.count{display:none}.btn .lbl{display:none}.btn{padding:0 11px}}
#pages{max-width:1100px;margin:0 auto;padding:18px 16px 60px;display:flex;flex-direction:column;align-items:safe center;gap:14px}
.page{position:relative;background:#fff;box-shadow:0 2px 6px rgba(11,42,82,.08),0 10px 28px rgba(11,42,82,.12);border-radius:4px;overflow:hidden;flex:none}
.page img{display:block;width:100%;height:auto;background:#fff}
.page .n{position:absolute;bottom:6px;left:8px;font:500 11px var(--f-ui);color:#8995aa;background:rgba(255,255,255,.85);padding:1px 7px;border-radius:999px}
.msg{max-width:520px;margin:60px auto;padding:24px;text-align:center;background:var(--surface);border:1px solid var(--line);border-radius:16px;line-height:1.9}
.msg a{color:var(--gold)}
.spin{width:34px;height:34px;margin:0 auto 12px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--gold);animation:r 1s linear infinite}
@keyframes r{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<header class="bar">
  <a class="btn" href="./" aria-label="الرئيسية"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg><span class="lbl">الرئيسية</span></a>
  <h1 id="title">ملخص المقرر</h1>
  <div class="tools">
    <span class="count" id="count" aria-live="polite"></span>
    <div class="zoom"><button class="btn" id="zout" aria-label="تصغير">−</button><button class="btn" id="zin" aria-label="تكبير">+</button></div>
    <a class="btn gold" id="dl" download><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg><span class="lbl">تحميل PDF</span></a>
  </div>
</header>
<main id="pages"><div class="msg" id="status"><div class="spin"></div>جارٍ تحميل الملخص…</div></main>

<script>
(function(){
  /* Pages are pictures made from the original PDF, so every phone and browser shows them exactly as designed. */
  var DOCS={
    usool:{title:"أصول كتابة البحث العلمي",desc:"ملخص الباب الأول من «أصول كتابة البحث العلمي وتحقيق المخطوطات» في خرائط ذهنية لمراحل البحث، مع بنك أسئلة، للقراءة وتحميل PDF.",file:"summaries/usool-kitabat-al-bahth.pdf",dl:"مرشد تلخيصي لأصول كتابة البحث العلمي.pdf",dir:"summaries/usool/",pages:27,w:1241,h:1755},
    manahij:{title:"مناهج المفسرين",desc:"زبدة مساق مناهج المفسرين في خرائط ذهنية وجداول: التفسير بالمأثور وبالرأي، والمدارس العقدية والفقهية، والاتجاهات الحديثة، للقراءة وتحميل PDF.",file:"summaries/manahij-al-mufassirin.pdf",dl:"زبدة مساق مناهج المفسرين.pdf",dir:"summaries/manahij/",pages:60,w:1755,h:1241}
  };
  var key=new URLSearchParams(location.search).get("c");
  var doc=DOCS[key], box=document.getElementById("pages"), status=document.getElementById("status"), count=document.getElementById("count");
  if(!doc){status.innerHTML='لم يُعثر على هذا الملخص. <a href="./">ارجع إلى الرئيسية</a>.';return;}
  document.title=doc.title+" — ملخص · منصة المذاكرة";
  /* search engines: one address and one description for each summary */
  var md=document.querySelector('meta[name="description"]'); if(md) md.content=doc.desc;
  var cn=document.createElement("link"); cn.rel="canonical"; cn.href="https://manassa-study.github.io/Tafseer/summary.html?c="+key; document.head.appendChild(cn);
  document.getElementById("title").textContent="ملخص "+doc.title;
  var dl=document.getElementById("dl"); dl.href=doc.file; dl.setAttribute("download",doc.dl);
  status.parentNode.removeChild(status);
  var scale=1, els=[];
  function pad(n){return n<10?"0"+n:""+n;}
  for(var i=1;i<=doc.pages;i++){
    var el=document.createElement("div"); el.className="page";
    var img=document.createElement("img"); img.src=doc.dir+"p-"+pad(i)+".jpg"; img.alt="صفحة "+i; img.width=doc.w; img.height=doc.h;
    img.loading=i<=2?"eager":"lazy"; img.decoding="async";
    var n=document.createElement("span"); n.className="n"; n.textContent=i;
    el.appendChild(img); el.appendChild(n); el._n=i; box.appendChild(el); els.push(el);
  }
  function layout(){var w=Math.min(box.clientWidth-32,1000)*scale; els.forEach(function(el){el.style.width=w+"px";});}
  layout(); count.textContent="1 / "+doc.pages;
  if("IntersectionObserver" in window){var cio=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting)count.textContent=e.target._n+" / "+doc.pages;});},{rootMargin:"-45% 0px -45% 0px"});
    els.forEach(function(el){cio.observe(el);});}
  function zoom(f){scale=Math.max(.5,Math.min(2.5,scale*f)); layout();}
  document.getElementById("zin").onclick=function(){zoom(1.2)};
  document.getElementById("zout").onclick=function(){zoom(1/1.2)};
  var rt; addEventListener("resize",function(){clearTimeout(rt);rt=setTimeout(layout,200);});
})();
</script>
</body>
</html>
